name: Profile health

on:
  push:
    paths:
      - README.md
      - assets/**
      - scripts/verify_profile.py
      - .github/workflows/profile-health.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/verify_profile.py
      - .github/workflows/profile-health.yml
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify profile assets, links and external renderers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_profile.py
