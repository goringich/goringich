name: Temporary Elizabeth VNext Portable Visual Preflight

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/elizabet-vnext-preflight-request.txt'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact preflight source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install visual preflight dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg python3-pil fonts-dejavu-core

      - name: Fetch and verify exact photographic assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat .github/elizabet-vnext-preflight-request.txt)" = 'enabled=true'
          mkdir -p stock-vnext
          fetch() {
            local key="$1" id="$2" expected="$3"
            curl -fL --retry 4 --retry-delay 1 -A 'Mozilla/5.0' -o "stock-vnext/${key}.jpg" "https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=1800"
            actual="$(sha256sum "stock-vnext/${key}.jpg" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]]
          }
          fetch couple 5493219 055e51ab4970696b3dfa1a41277983eaf24c3e8cb0f9b8aaba5cf4e8f8548136
          fetch gift 7910649 b31cadb0f296e84be182a27e59c0ee991dba269e40c5894ccf81d1397f341964
          fetch hands 7715723 2c4e019bbfee0237b4cf9eaa7dd071d9b229b591c8851aba13f65034a0afe9df
          fetch polaroid 6188753 e108091e08008f28e01008deabe0dc7869231982d0f964d7df86a98745e2c6b7
          fetch letter 10660565 189307064b4ff3f3afd47ded59ba23ed0d036da125da897bbe2a153f2a7c96c3
          fetch city 7922285 ef3ad90421fdc21f0f0fe5723655e0b9f3d5b2066b5de912f87f87ef7544f506

      - name: Render 15 second photographic preflight
        run: |
          set -Eeuo pipefail
          python3 tools/elizabet_vnext_preflight.py
          test -s vnext-preflight/gift-room-vnext-portable-preflight.mp4
          test -s vnext-preflight/gift-room-vnext-portable-contact-sheet.jpg
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate,nb_frames -show_entries format=duration -of json vnext-preflight/gift-room-vnext-portable-preflight.mp4

      - name: Upload portable visual review bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elizabet-vnext-portable-visual-preflight
          path: |
            vnext-preflight/gift-room-vnext-portable-preflight.mp4
            vnext-preflight/gift-room-vnext-portable-contact-sheet.jpg
          if-no-files-found: error
          retention-days: 1
