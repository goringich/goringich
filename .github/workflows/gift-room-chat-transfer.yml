name: Temporary Gift Room Chat File Transport

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/gift-room-chat-transfer-request.txt'

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact transport request
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve temporary request
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          request='.github/gift-room-chat-transfer-request.txt'
          test -s "$request"
          enabled="$(awk -F= '$1 == "enabled" {print substr($0, index($0, "=") + 1); exit}' "$request")"
          source_sha="$(awk -F= '$1 == "source_sha" {print substr($0, index($0, "=") + 1); exit}' "$request")"
          release_tag="$(awk -F= '$1 == "release_tag" {print substr($0, index($0, "=") + 1); exit}' "$request")"
          [[ "$enabled" == 'true' || "$enabled" == 'false' ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$release_tag" =~ ^gift-room-portfolio-[0-9]+-[0-9a-f]{12}$ ]]
          printf 'enabled=%s\nsource_sha=%s\nrelease_tag=%s\n' "$enabled" "$source_sha" "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download and verify exact public-safe MP4 candidates
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          request='.github/gift-room-chat-transfer-request.txt'
          mkdir -p delivery
          mapfile -t rows < <(awk 'BEGIN{assets=0} /^assets_begin$/ {assets=1; next} /^assets_end$/ {assets=0; next} assets {print}' "$request")
          [[ "${#rows[@]}" -eq 8 ]]

          expected_names=(
            gift-room-portfolio-all-of-us.mp4
            gift-room-portfolio-anniversary-panic.mp4
            gift-room-portfolio-anti-generic.mp4
            gift-room-portfolio-curiosity-reveal.mp4
            gift-room-portfolio-distance-place.mp4
            gift-room-portfolio-i-remember.mp4
            gift-room-portfolio-open-in-a-year.mp4
            gift-room-portfolio-where-it-started.mp4
          )
          declare -A seen=()
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r name expected_sha url extra <<<"$row"
            [[ -n "$name" && -n "$expected_sha" && -n "$url" && -z "${extra:-}" ]]
            [[ "$name" =~ ^gift-room-portfolio-[a-z0-9-]+\.mp4$ ]]
            [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
            [[ "$url" == https://release-assets.githubusercontent.com/* ]]
            [[ -z "${seen[$name]:-}" ]]
            seen[$name]=1
            curl -fL --retry 3 --retry-delay 1 -o "delivery/$name" "$url"
            actual_sha="$(sha256sum "delivery/$name" | awk '{print $1}')"
            [[ "$actual_sha" == "$expected_sha" ]]
          done
          [[ "${#seen[@]}" -eq 8 ]]
          for name in "${expected_names[@]}"; do
            [[ "${seen[$name]:-}" == 1 ]]
            test -s "delivery/$name"
          done

          for file in delivery/*.mp4; do
            width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$file")"
            height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$file")"
            rate="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$file")"
            frames="$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "$file")"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$file")"
            [[ "$width" == 1080 && "$height" == 1920 ]]
            [[ "$rate" == '30/1' || "$rate" == '30' ]]
            [[ "$frames" == 450 ]]
            awk -v d="$duration" 'BEGIN { exit !(d >= 14.99 && d <= 15.01) }'
          done
          echo "EXACT_EIGHT_PUBLIC_SAFE_MP4_TRANSPORT_PASS source=${{ steps.request.outputs.source_sha }} release=${{ steps.request.outputs.release_tag }}"

      - name: Upload exact eight-video bundle
        if: steps.request.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gift-room-exact-eight-mp4-${{ steps.request.outputs.source_sha }}
          path: delivery/*.mp4
          if-no-files-found: error
          retention-days: 1
