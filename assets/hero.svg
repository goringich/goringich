<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Igor Kim — Fullstack Engineer</title>
  <desc id="desc">Fullstack engineer focused on real-time interfaces, Linux and Yocto systems, and local AI tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.48" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#08111d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.52" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#58a6ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="945" cy="188" rx="310" ry="250" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#58a6ff" stroke-opacity="0.22"/>

  <g transform="translate(64 55)">
    <circle cx="7" cy="7" r="7" fill="#3fb950"/>
    <text x="26" y="12" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="2">AVAILABLE FOR SELECTED ENGINEERING WORK</text>

    <text x="0" y="103" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-2">IGOR KIM</text>
    <rect x="0" y="122" width="520" height="5" rx="2.5" fill="url(#accent)"/>

    <text x="0" y="168" fill="#c9d1d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650">Fullstack Engineer · Real-time UI · Linux / Yocto · Local AI</text>
    <text x="0" y="205" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">I build interactive systems that connect product UI, backend services,</text>
    <text x="0" y="232" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">automation, observability and low-level engineering workflows.</text>

    <g transform="translate(0 274)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">
      <rect width="176" height="42" rx="12" fill="#111b2e" stroke="#58a6ff" stroke-opacity="0.28"/>
      <text x="18" y="27" fill="#79c0ff">HSE SOFTWARE '27</text>

      <g transform="translate(190 0)">
        <rect width="206" height="42" rx="12" fill="#111b2e" stroke="#00e5ff" stroke-opacity="0.26"/>
        <text x="18" y="27" fill="#56d4dd">YADRO / RADIO GIGABIT</text>
      </g>

      <g transform="translate(410 0)">
        <rect width="232" height="42" rx="12" fill="#111b2e" stroke="#7c5cff" stroke-opacity="0.28"/>
        <text x="18" y="27" fill="#b7a6ff">REACT · TS · GO · PYTHON</text>
      </g>
    </g>
  </g>

  <g transform="translate(820 76)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#58a6ff" stroke-opacity="0.25" stroke-width="2">
      <path d="M56 48 L180 24 L272 84 L236 196 L116 238 L30 164 Z"/>
      <path d="M56 48 L116 238 M180 24 L236 196 M272 84 L30 164"/>
      <path d="M56 48 L236 196 M180 24 L30 164 M272 84 L116 238"/>
    </g>

    <g filter="url(#softGlow)">
      <circle cx="56" cy="48" r="8" fill="#58a6ff"/>
      <circle cx="180" cy="24" r="7" fill="#00e5ff"/>
      <circle cx="272" cy="84" r="8" fill="#7c5cff"/>
      <circle cx="236" cy="196" r="7" fill="#58a6ff"/>
      <circle cx="116" cy="238" r="8" fill="#00e5ff"/>
      <circle cx="30" cy="164" r="7" fill="#7c5cff"/>
      <circle cx="150" cy="132" r="13" fill="#f0f6fc"/>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">
      <text x="74" y="53" fill="#79c0ff">UI</text>
      <text x="194" y="29" fill="#56d4dd">AI</text>
      <text x="286" y="89" fill="#b7a6ff">DATA</text>
      <text x="250" y="201" fill="#79c0ff">API</text>
      <text x="130" y="243" fill="#56d4dd">LINUX</text>
      <text x="0" y="150" fill="#b7a6ff">RT</text>
      <text x="130" y="137" fill="#0d1117">SYS</text>
    </g>
  </g>

  <text x="1136" y="388" text-anchor="end" fill="#30363d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">goringich / build · observe · verify</text>
</svg>