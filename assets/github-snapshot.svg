<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GitHub engineering footprint</title><desc id="desc">A verified overview of Igor Kim's public proof, private product work and engineering domains without unreliable third-party inferred statistics.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0B1320"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58A6FF"/><stop offset=".5" stop-color="#00E5FF"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient></defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#58A6FF" stroke-opacity=".22"/><rect width="1200" height="5" rx="2.5" fill="url(#a)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="42" y="48" fill="#00E5FF" font-size="12" font-weight="800" letter-spacing="1.6">GITHUB / VERIFIED ENGINEERING FOOTPRINT</text><text x="42" y="91" fill="#F0F6FC" font-size="28" font-weight="820">Evidence over vanity metrics</text><text x="42" y="121" fill="#9DA7B3" font-size="15.5">This profile intentionally avoids third-party inferred commit/language totals when they do not match the account.</text>
    <g transform="translate(42 158)"><rect width="348" height="154" rx="18" fill="#0B1524" stroke="#58A6FF" stroke-opacity=".22"/><text x="22" y="31" fill="#79C0FF" font-size="12" font-weight="800" letter-spacing="1.1">PUBLIC PROOF</text><text x="22" y="64" fill="#E2E8F0" font-size="16" font-weight="720">Local AI OS · 3D Graph · Algorithmic Course</text><text x="22" y="92" fill="#9DA7B3" font-size="14">Open repositories show product systems,</text><text x="22" y="114" fill="#9DA7B3" font-size="14">visualization, Linux tooling and automation.</text><circle cx="25" cy="135" r="4" fill="#3FB950"/><text x="38" y="139" fill="#758499" font-size="11">linked and inspectable</text></g>
    <g transform="translate(426 158)"><rect width="348" height="154" rx="18" fill="#0B1524" stroke="#00E5FF" stroke-opacity=".22"/><text x="22" y="31" fill="#56D4DD" font-size="12" font-weight="800" letter-spacing="1.1">COMMERCIAL / PRIVATE WORK</text><text x="22" y="64" fill="#E2E8F0" font-size="16" font-weight="720">Elizabeth · Commerce Ops · LeadDesk</text><text x="22" y="92" fill="#9DA7B3" font-size="14">Production and product-development work</text><text x="22" y="114" fill="#9DA7B3" font-size="14">is summarized without exposing private code.</text><circle cx="25" cy="135" r="4" fill="#00E5FF"/><text x="38" y="139" fill="#758499" font-size="11">public-safe summaries only</text></g>
    <g transform="translate(810 158)"><rect width="348" height="154" rx="18" fill="#0B1524" stroke="#8B7CFF" stroke-opacity=".24"/><text x="22" y="31" fill="#B7A6FF" font-size="12" font-weight="800" letter-spacing="1.1">ENGINEERING DOMAINS</text><text x="22" y="64" fill="#E2E8F0" font-size="16" font-weight="720">Fullstack · Automation · Agentic Systems</text><text x="22" y="92" fill="#9DA7B3" font-size="14">Linux / Yocto · real-time software · data ·</text><text x="22" y="114" fill="#9DA7B3" font-size="14">observability · release and recovery systems.</text><circle cx="25" cy="135" r="4" fill="#8B7CFF"/><text x="38" y="139" fill="#758499" font-size="11">current professional direction</text></g>
  </g>
