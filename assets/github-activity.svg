<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Contribution activity</title><desc id="desc">A visual pointer to the authoritative native GitHub contribution calendar shown directly below the profile README.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0B1320"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58A6FF"/><stop offset=".52" stop-color="#00E5FF"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="230" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="228" rx="25" fill="none" stroke="#58A6FF" stroke-opacity=".20"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="42" y="46" fill="#00E5FF" font-size="12" font-weight="800" letter-spacing="1.5">CONTRIBUTION ACTIVITY</text><text x="42" y="84" fill="#F0F6FC" font-size="25" font-weight="820">Use GitHub's native calendar as the source of truth</text><text x="42" y="113" fill="#9DA7B3" font-size="15">The authoritative contribution history is rendered by GitHub immediately below this README.</text>
    <g transform="translate(42 147)"><path d="M0 25 C120 25 120 5 240 5 S360 45 480 25 S600 5 720 25 S840 45 960 15" fill="none" stroke="url(#line)" stroke-width="3"/><g filter="url(#g)"><circle cx="0" cy="25" r="5" fill="#58A6FF"/><circle cx="240" cy="5" r="5" fill="#00E5FF"/><circle cx="480" cy="25" r="5" fill="#8B7CFF"/><circle cx="720" cy="25" r="5" fill="#00E5FF"/><circle cx="960" cy="15" r="5" fill="#58A6FF"/></g><text x="0" y="54" fill="#657386" font-size="10.5" font-weight="700">PRODUCTS</text><text x="210" y="54" fill="#657386" font-size="10.5" font-weight="700">AUTOMATION</text><text x="450" y="54" fill="#657386" font-size="10.5" font-weight="700">SYSTEMS</text><text x="700" y="54" fill="#657386" font-size="10.5" font-weight="700">AGENTS</text><text x="915" y="54" fill="#657386" font-size="10.5" font-weight="700">OPERATIONS</text></g>
    <g transform="translate(1060 95)"><circle cx="0" cy="0" r="34" fill="#0E1A2A" stroke="#00E5FF" stroke-opacity=".35"/><path d="M0 -13V13M-9 5L0 14L9 5" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="55" text-anchor="middle" fill="#738196" font-size="10" font-weight="700">NATIVE CALENDAR</text></g>
  </g>
</svg>